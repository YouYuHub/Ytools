name: Validate project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: npm ci --prefix H5
      - run: npm ci --prefix browser
      - run: node browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: python scripts/release_check.py --profile release --report-dir tmp/ci-validation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: tmp/ci-validation/
          retention-days: 7
