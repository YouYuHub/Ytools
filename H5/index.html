<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ytools</title>
    <!-- 先设置 data-theme，避免首屏闪烁 -->
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="style/css/main.css">
</head>

<body>
    <div class="app empty" id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <!-- 折叠态：窄图标栏 -->
            <div class="rail">
                <button class="rail-btn rail-logo" id="railExpand" title="展开侧边栏">Y</button>
                <button class="rail-btn" id="railNewChat" title="新对话">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M13.5 3.5H8a4.5 4.5 0 0 0-4.5 4.5v8a4.5 4.5 0 0 0 4.5 4.5h8a4.5 4.5 0 0 0 4.5-4.5V10" />
                        <path d="m12.1 11.9 8-8a1.56 1.56 0 0 1 2.2-2.2L14.3 9.7l-1.3 1.2L12 12Z" />
                    </svg>
                </button>
                <button class="rail-btn" id="railChats" title="历史会话">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8.5" />
                        <path d="M12 7.5V12l3.3 2" />
                    </svg>
                </button>
                <div class="rail-spacer"></div>
                <button class="rail-avatar" id="railAvatar" title="主题">Y</button>
            </div>

            <!-- 展开态：完整面板 -->
            <div class="panel">
                <div class="panel-head">
                    <span class="wordmark">Ytools</span>
                    <button class="icon-btn" id="searchBtn" title="搜索会话">
                        <svg class="icon" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </button>
                    <button class="icon-btn" id="sidebarToggle" title="收起侧边栏">
                        <svg class="icon" viewBox="0 0 24 24">
                            <rect x="3.5" y="4.5" width="17" height="15" rx="4" />
                            <path d="M9.5 4.5v15" />
                        </svg>
                    </button>
                </div>

                <button class="side-row" id="newChatBtn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M13.5 3.5H8a4.5 4.5 0 0 0-4.5 4.5v8a4.5 4.5 0 0 0 4.5 4.5h8a4.5 4.5 0 0 0 4.5-4.5V10" />
                        <path d="m12.1 11.9 8-8a1.56 1.56 0 0 1 2.2-2.2L14.3 9.7l-1.3 1.2L12 12Z" />
                    </svg>
                    <span>新对话</span>
                </button>

                <div class="search-box" id="searchBox">
                    <input class="search-input" id="searchInput" type="text" placeholder="搜索会话...">
                </div>

                <div class="session-list" id="sessionList">
                    <div class="session-label">最近</div>
                </div>

                <div class="panel-foot">
                    <div class="menu theme-menu hidden" id="themeMenu">
                        <button class="menu-item" data-value="system">
                            <svg class="icon" viewBox="0 0 24 24">
                                <rect x="2" y="4" width="20" height="13" rx="2" />
                                <path d="M8 21h8m-4-4v4" />
                            </svg>
                            <span class="menu-item-label">跟随系统</span>
                            <svg class="menu-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M20 6 9 17l-5-5" />
                            </svg>
                        </button>
                        <button class="menu-item" data-value="light">
                            <svg class="icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="4" />
                                <path
                                    d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                            </svg>
                            <span class="menu-item-label">浅色</span>
                            <svg class="menu-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M20 6 9 17l-5-5" />
                            </svg>
                        </button>
                        <button class="menu-item" data-value="dark">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                            </svg>
                            <span class="menu-item-label">深色</span>
                            <svg class="menu-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M20 6 9 17l-5-5" />
                            </svg>
                        </button>
                    </div>
                    <button class="profile-card" id="profileCard" title="主题设置">
                        <span class="avatar">Y</span>
                        <span class="profile-info">
                            <span class="profile-name">访客用户</span>
                            <span class="profile-sub" id="profileSub">跟随系统</span>
                        </span>
                        <span class="profile-plan">主题</span>
                    </button>
                </div>
            </div>
        </aside>

        <div class="scrim" id="scrim"></div>

        <!-- 主区 -->
        <main class="main">
            <header class="topbar">
                <button class="icon-btn only-mobile" id="menuToggle" title="打开侧边栏">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div class="topbar-spacer"></div>
                <span class="token-total hidden" id="tokenTotal" title="本会话累计 token 消耗"></span>
                <div class="top-actions">
                    <button class="icon-btn" id="sessionActionsBtn" title="加载">
                        <svg class="icon icon-dots" viewBox="0 0 24 24">
                            <circle cx="12" cy="5" r="2" fill="currentColor" stroke="none" />
                            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
                            <circle cx="12" cy="19" r="2" fill="currentColor" stroke="none" />
                        </svg>
                        <svg class="icon icon-load" viewBox="0 0 24 24">
                            <path d="M12 3v12m0 0 4-4m-4 4-4-4" />
                            <path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
                        </svg>
                    </button>
                    <!-- 会话操作菜单：空态点击按钮直接进入加载；有会话内容时展开三项 -->
                    <div class="menu topbar-menu hidden" id="sessionActionsMenu">
                        <button class="menu-item hidden" id="shareSessionItem">
                            <svg class="icon" viewBox="0 0 24 24">
                                <circle cx="18" cy="5" r="3" />
                                <circle cx="6" cy="12" r="3" />
                                <circle cx="18" cy="19" r="3" />
                                <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4" />
                            </svg>
                            <span class="menu-item-label">分享对话</span>
                        </button>
                        <button class="menu-item" id="loadHistoryItem">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M12 3v12m0 0 4-4m-4 4-4-4" />
                                <path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
                            </svg>
                            <span class="menu-item-label">加载 JSONL</span>
                        </button>
                        <button class="menu-item hidden" id="compactSessionItem">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M4 5h16M4 19h16" />
                                <path d="m9 9 3-3 3 3M9 15l3 3 3-3" />
                            </svg>
                            <span class="menu-item-label">压缩对话</span>
                        </button>
                    </div>
                </div>
            </header>

            <div class="chat-scroll" id="chatScroll">
                <div class="chat-inner" id="chatInner"></div>
            </div>

            <!-- 右侧问题导航（hover 展开问题列表） -->
            <div class="qnav hidden" id="qnav">
                <div class="qnav-panel" id="qnavPanel"></div>
                <div class="qnav-rail" id="qnavRail"></div>
            </div>

            <button class="scroll-bottom-btn" id="scrollBottomBtn" title="回到底部">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 5v14m-7-7 7 7 7-7" />
                </svg>
            </button>

            <div class="bottom">
                <div class="welcome" id="welcome">
                    <div class="welcome-title">该从哪里开始？</div>
                </div>
                <div class="composer-wrap">
                    <div class="context-token-status ctx-hidden" id="contextTokenStatus">
                        <span class="context-token-todo-slot" id="contextTokenTodoSlot"></span>
                        <span class="context-token-summary" id="contextTokenSummary"></span>
                        <span class="context-token-workdir" id="contextTokenWorkdir" title="工作路径加载中..."></span>
                    </div>
                    <!-- 任务计划面板：垂直布局占位（不遮挡输入框），位于状态栏与输入框之间 -->
                    <div class="todo-panel hidden" id="todoPanel"></div>
                    <div class="composer">
                        <div class="enhance-panel hidden" id="enhancePanel">
                            <div class="enhance-head">
                                <strong>模型与参数设置</strong>
                                <button class="icon-btn" id="enhanceClose" title="关闭">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M6 6l12 12M18 6 6 18" />
                                    </svg>
                                </button>
                            </div>
                            <div class="model-tabs" id="modelTabs">
                                <button class="model-tab active" type="button" data-role="chat_model">聊天模型</button>
                                <button class="model-tab" type="button" data-role="compaction_model">压缩模型</button>
                                <button class="model-tab" type="button" data-role="title_model">标题模型</button>
                            </div>
                            <div class="enhance-body">
                                <label class="enhance-field">
                                    <span>选择模型</span>
                                    <button class="model-picker" id="modelPicker" type="button">
                                        <span class="model-picker-label placeholder" id="modelPickerLabel">请选择模型</span>
                                        <svg class="icon model-picker-arrow" viewBox="0 0 24 24">
                                            <path d="m6 9 6 6 6-6" />
                                        </svg>
                                    </button>
                                </label>
                                <div class="model-list hidden" id="modelList"></div>
                                <label class="enhance-range">
                                    <span><b>Temperature</b><output id="temperatureValue">0.7</output></span>
                                    <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7">
                                </label>
                                <label class="enhance-range">
                                    <span><b>最大输出 token</b><output id="maxTokensValue">8192</output></span>
                                    <input id="maxTokens" type="range" min="256" max="131072" step="256">
                                </label>
                                <label class="enhance-range">
                                    <span><b>Top P</b><output id="topPValue">1</output></span>
                                    <input id="topP" type="range" min="0" max="1" step="0.05" value="1">
                                </label>
                                <label class="enhance-range">
                                    <span><b>Presence penalty</b><output id="presencePenaltyValue">2</output></span>
                                    <input id="presencePenalty" type="range" min="-2" max="2" step="0.1" value="2">
                                </label>
                                <label class="enhance-field">
                                    <span>思考深度</span>
                                    <select id="reasoningEffort">
                                        <option value="none">none</option>
                                        <option value="minimal">minimal</option>
                                        <option value="low">low</option>
                                        <option value="medium">medium</option>
                                        <option value="high">high</option>
                                        <option value="xhigh">xhigh</option>
                                        <option value="max">max</option>
                                    </select>
                                </label>
                                <label class="enhance-check">
                                    <input type="checkbox" id="enableThinking">
                                    <span>启用 thinking</span>
                                    <small>通过 extra_body.enable_thinking 传递</small>
                                </label>
                            </div>
                            <div class="enhance-foot">
                                <div class="enhance-foot-left">
                                    <button id="enhanceReset" type="button">恢复默认</button>
                                    <span id="enhanceHint">参数未修改时仅切换模型、保留原参数</span>
                                </div>
                                <div class="enhance-actions">
                                    <button id="enhanceCancel" type="button">取消</button>
                                    <button id="enhanceConfirm" type="button">确定</button>
                                </div>
                            </div>
                        </div>
                        <div class="menu plus-menu hidden" id="plusMenu">
                            <button class="menu-item" id="uploadItem">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path
                                        d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                                </svg>
                                <span class="menu-item-label">上传文件</span>
                            </button>
                            <button class="menu-item" id="toolsItem">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path
                                        d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7Z" />
                                </svg>
                                <span class="menu-item-label">选择工具</span>
                            </button>
                            <button class="menu-item" id="chatSettingsItem">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6" />
                                </svg>
                                <span class="menu-item-label">聊天设置</span>
                            </button>
                            <button class="menu-item" id="todoToggleItem">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path d="M9 11l3 3 8-8M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                                </svg>
                                <span class="menu-item-label">任务计划 (todo)</span>
                                <span class="menu-item-state" id="todoToggleState">关</span>
                            </button>
                        </div>
                        <!-- 待发送媒体附件预览区：粘贴/选择图片等媒体后显示在输入框上方 -->
                        <div class="composer-attachments hidden" id="composerAttachments"></div>
                        <textarea class="composer-input" id="input" rows="1" placeholder="应该做什么"></textarea>
                        <div class="composer-bar">
                            <button class="composer-btn" id="plusBtn" title="更多功能">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                            </button>
                            <div class="composer-bar-spacer"></div>
                            <button class="boost-btn" id="boostBtn" title="模型与参数设置">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path
                                        d="M12 3a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 3Z" />
                                    <path d="M9 21h6" />
                                </svg>
                                <span class="menu-item-label">参数</span>
                            </button>
                            <!-- <button class="composer-btn" id="micBtn" title="语音对话">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
                                </svg>
                            </button> --> <!-- 语音对话暂未实现，暂时隐藏按钮 -->
                            <button class="round-btn" id="voiceBtn" title="语音输入">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <rect x="9" y="3" width="6" height="11" rx="3" />
                                    <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
                                </svg>
                            </button>
                            <button class="round-btn hidden" id="sendBtn" title="发送">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path d="M12 19V5m-7 7 7-7 7 7" />
                                </svg>
                            </button>
                            <button class="round-btn hidden" id="stopBtn" title="停止生成">
                                <span class="stop-square"></span>
                            </button>
                        </div>
                    </div>
                    <div class="file-chips hidden" id="fileChips"></div>
                    <div class="tool-chips hidden" id="toolChips"></div>
                    <input type="file" id="fileInput" multiple hidden>
                    <input type="file" id="historyFileInput" accept=".jsonl,.json,application/json" hidden>
                    <div class="suggest-row" id="suggestRow">
                        <button class="suggest-chip" data-prompt="解释一下什么是 SSE 流式响应，它和普通接口有什么区别？">什么是 SSE 流式响应</button>
                        <button class="suggest-chip" data-prompt="帮我用 Python 写一个带注释的快速排序">写一段快速排序</button>
                        <button class="suggest-chip" data-prompt="你现在可以使用哪些工具？分别能做什么？">你能用哪些工具</button>
                        <button class="suggest-chip" data-prompt="帮我制定一份为期一周的英语学习计划">制定英语学习计划</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="tool-modal hidden" id="toolModal" aria-hidden="true">
        <div class="tool-modal-backdrop" id="toolModalBackdrop"></div>
        <section class="tool-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="toolModalTitle">
            <header class="tool-modal-head">
                <h2 id="toolModalTitle">配置工具</h2>
                <button class="icon-btn" id="toolModalClose" title="关闭">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M6 6l12 12M18 6 6 18" />
                    </svg>
                </button>
            </header>
            <div class="tool-modal-toolbar">
                <button class="tool-collapse-all" id="toolCollapseAll" title="折叠全部">−</button>
                <button class="tool-refresh" id="toolRefresh" title="更新全部工具">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M20 11a8 8 0 0 0-14.7-4L4 9" />
                        <path d="M4 4v5h5M4 13a8 8 0 0 0 14.7 4L20 15" />
                        <path d="M20 20v-5h-5" />
                    </svg>
                </button>
                <label class="tool-search">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                    <input id="toolSearchInput" type="search" placeholder="选择可用于聊天的工具。">
                </label>
                <span class="tool-selected" id="toolSelected">已选 0 项</span>
                <button class="tool-confirm" id="toolConfirm">确定</button>
            </div>
            <p class="tool-modal-desc">所选工具仅应用于当前聊天会话。</p>
            <div class="tool-groups" id="toolGroups"></div>
        </section>
    </div>

    <!-- 媒体/文档预览模态框：点击消息与附件区的图片/视频/音频/PDF时打开，
         关闭时销毁内部媒体元素以停止播放 -->
    <div class="media-preview-modal hidden" id="mediaPreviewModal" aria-hidden="true">
        <div class="media-preview-backdrop" id="mediaPreviewBackdrop"></div>
        <div class="media-preview-dialog" role="dialog" aria-modal="true">
            <header class="media-preview-head">
                <span class="media-preview-title" id="mediaPreviewTitle"></span>
                <button class="media-preview-close" id="mediaPreviewClose" title="关闭">✕</button>
            </header>
            <div class="media-preview-body" id="mediaPreviewBody"></div>
        </div>
    </div>

    <div class="tool-modal hidden" id="chatSettingsModal" aria-hidden="true">
        <div class="tool-modal-backdrop" id="chatSettingsBackdrop"></div>
        <section class="tool-modal-dialog chat-settings-dialog" role="dialog" aria-modal="true"
            aria-labelledby="chatSettingsTitle">
            <header class="tool-modal-head">
                <h2 id="chatSettingsTitle">聊天设置</h2>
                <button class="icon-btn" id="chatSettingsClose" title="关闭">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M6 6l12 12M18 6 6 18" />
                    </svg>
                </button>
            </header>
            <div class="chat-settings-body">
                <section class="chat-settings-section">
                    <h3>上下文回传长度</h3>
                    <label class="chat-setting-field">
                        <span>思考过程回传长度<small>0=不回传 · 负数=全部 · 正数=保留末尾 N 字符</small></span>
                        <input id="reasoningMaxLength" type="number" step="1">
                    </label>
                    <label class="chat-setting-field">
                        <span>工具结果回传长度<small>0=不回传 · 负数=全部 · 正数=保留开头 N 字符</small></span>
                        <input id="toolResultMaxLength" type="number" step="1">
                    </label>
                </section>
                <section class="chat-settings-section">
                    <h3>历史压缩策略</h3>
                    <label class="chat-setting-field">
                        <span>历史轮数窗口<small>上下文保留的总轮次：未压缩轮次完整对话+已压缩轮次问题保真；0=无限（按阈值压缩）</small></span>
                        <input id="keepRounds" type="number" min="0" max="200" step="1">
                    </label>
                    <label class="chat-setting-field">
                        <span>触发比例<small>历史上下文达到聊天窗口的该比例时触发压缩</small></span>
                        <input id="triggerRatio" type="number" min="0.01" max="0.95" step="0.01">
                    </label>
                    <label class="chat-setting-field">
                        <span>摘要预算比例<small>累计摘要总预算=聊天窗口×比例，最大 0.5</small></span>
                        <input id="summaryBudgetRatio" type="number" min="0.01" max="0.5" step="0.05">
                    </label>
                    <label class="chat-setting-field">
                        <span>超长结果拒绝系数<small>单工具结果超过阈值的拒绝系数，0=关闭</small></span>
                        <input id="oversizedRejectFactor" type="number" min="0" step="0.1">
                    </label>
                    <label class="chat-setting-field">
                        <span>连续拒绝上限<small>连续超长拒绝达到该次数时终止任务</small></span>
                        <input id="maxOversizedRejections" type="number" min="1" step="1">
                    </label>
                    <p class="chat-settings-note">压缩模型请在「参数」面板的「压缩模型」选项卡中选择（该字段已由 /chat_config/models/select 接管）。</p>
                </section>
            </div>
            <div class="chat-settings-foot">
